name: Unit Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install fake-bpy-module-3.6

    - name: Run Standalone Python Tests (Math & Mocks)
      run: |
        python -m unittest test_soliton.py

    - name: Cache Blender Binary
      id: cache-blender
      uses: actions/cache@v4
      with:
        path: blender-3.6.0-linux-x64
        key: ${{ runner.os }}-blender-3.6.0

    - name: Download and Extract Blender
      if: steps.cache-blender.outputs.cache-hit != 'true'
      run: |
        wget https://download.blender.org/release/Blender3.6/blender-3.6.0-linux-x64.tar.xz
        tar -xf blender-3.6.0-linux-x64.tar.xz

    - name: Run Integration Tests in Blender (Headless)
      run: |
        ./blender-3.6.0-linux-x64/blender --background --python test_soliton.py
